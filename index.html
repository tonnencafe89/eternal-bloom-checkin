<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Eternal Bloom Check-in</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f8f3f5;
  color: #55444d;
}

.container {
  max-width: 480px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  color: #a66b83;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  margin-bottom: 25px;
  color: #927d87;
}

label {
  display: block;
  margin-top: 15px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #e5d4dc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #b77d96;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#reader {
  width: 100%;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 12px;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 12px;
  background: #faf4f7;
}

.success {
  color: #27845b;
  font-weight: bold;
  font-size: 20px;
  text-align: center;
}

.error {
  color: #c14e61;
  text-align: center;
  font-weight: bold;
}

.info {
  margin-top: 15px;
  line-height: 1.9;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.status {
  background: #e2f4e9;
  color: #27845b;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  margin-top: 12px;
  font-weight: bold;
}

.hidden {
  display: none !important;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #ad9ca4;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>ETERNAL BLOOM</h1>

<div class="subtitle">
OFFICIAL EVENT CHECK-IN
</div>

<label>Staff PIN</label>
<input
  type="password"
  id="pin"
  placeholder="Enter staff PIN"
>

<button id="startBtn" onclick="startScanner()">
START SCANNER
</button>

<div id="reader"></div>

<div id="message"></div>

<div id="result" class="result">

<div id="resultTitle"></div>

<div class="info" id="details"></div>

<div id="statusBox"></div>

</div>

<button
  id="againBtn"
  class="hidden"
  onclick="scanAgain()">
SCAN NEXT GUEST
</button>

<div class="footer">
ETERNAL BLOOM CHECK-IN SYSTEM
</div>

</div>

<script>

// ===================================
// CONFIGURATION
// ===================================

const GAS_URL = "https://script.google.com/macros/s/AKfycbwGYu0OdJGtVKh6f85un6RGyFQiedlB9cFBq0h1oZeyCxnjmyOyV0Z89egqazRlyqvEMA/exec";

let scanner = null;
let busy = false;
let scanning = false;

// ===================================
// START CAMERA
// ===================================

async function startScanner() {

  const pin = document.getElementById("pin").value.trim();

  if (!pin) {
    showMessage("Please enter Staff PIN", true);
    return;
  }

  document.getElementById("message").innerHTML = "";

  document.getElementById("result").style.display = "none";

  document.getElementById("againBtn").classList.add("hidden");

  if (scanner) {
    try {
      await scanner.clear();
    } catch(e) {}
  }

  scanner = new Html5Qrcode("reader");

  try {

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScanSuccess
    );

    scanning = true;

    document.getElementById("startBtn").disabled = true;

  } catch(error) {

    showMessage(
      "Cannot access camera. Please allow camera permission.",
      true
    );

  }
}

// ===================================
// QR SCAN
// ===================================

async function onScanSuccess(decodedText) {

  if (busy) return;

  busy = true;

  try {
    await scanner.pause(true);
  } catch(e) {}

  checkInGuest(decodedText);

}

// ===================================
// CONNECT GOOGLE APPS SCRIPT
// ===================================

function checkInGuest(registrationId) {

  const pin = document.getElementById("pin").value.trim();

  showMessage("Checking registration...", false);

  const callbackName =
    "ebCallback_" + Date.now() + "_" +
    Math.floor(Math.random() * 10000);

  const script = document.createElement("script");

  let finished = false;

  const timeout = setTimeout(() => {

    finish();

    showMessage(
      "Connection timeout. Please try again.",
      true
    );

    unlockScanner();

  }, 25000);

  function finish() {

    if (finished) return;

    finished = true;

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

  }

  window[callbackName] = function(response) {

    finish();

    handleResponse(response);

  };

  const params = new URLSearchParams({

    action: "checkin",

    registrationId: registrationId,

    pin: pin,

    callback: callbackName

  });

  script.src = GAS_URL + "?" + params.toString();

  script.onerror = function() {

    finish();

    showMessage(
      "Cannot connect to Google Apps Script.",
      true
    );

    unlockScanner();

  };

  document.body.appendChild(script);

}

// ===================================
// RESPONSE
// ===================================

function handleResponse(response) {

  document.getElementById("message").innerHTML = "";

  const result = document.getElementById("result");

  result.style.display = "block";

  if (!response || response.success !== true) {

    document.getElementById("resultTitle").innerHTML =
      '<div class="error">' +
      escapeHTML(response?.message || "CHECK-IN FAILED") +
      '</div>';

    document.getElementById("details").innerHTML = "";

    document.getElementById("statusBox").innerHTML = "";

    document.getElementById("againBtn").classList.remove("hidden");

    return;

  }

  document.getElementById("resultTitle").innerHTML =
    '<div class="success">CHECK-IN SUCCESSFUL</div>';

  document.getElementById("details").innerHTML = `

    <b>Name:</b> ${escapeHTML(response.name || "-")}<br>

    <b>Round:</b> ${escapeHTML(response.round || "-")}<br>

    <b>Menu:</b> ${escapeHTML(response.menu || "-")}<br>

    <b>Registration ID:</b> ${escapeHTML(response.id || "-")}<br>

    <b>Event Date:</b> ${escapeHTML(response.eventDate || "-")}<br>

    <b>Check-in Date & Time:</b>
    ${escapeHTML(response.time || "-")}

  `;

  document.getElementById("statusBox").innerHTML =
    '<div class="status">CHECKED IN</div>';

  document.getElementById("againBtn").classList.remove("hidden");

}

// ===================================
// HTML SAFETY
// ===================================

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, function(char) {

    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char];

  });

}

// ===================================
// SCAN AGAIN
// ===================================

async function scanAgain() {

  document.getElementById("result").style.display = "none";

  document.getElementById("message").innerHTML = "";

  busy = false;

  try {

    if (scanner && scanning) {

      await scanner.resume();

    } else {

      startScanner();

    }

  } catch(e) {

    startScanner();

  }

}

// ===================================
// MESSAGE
// ===================================

function showMessage(message, isError) {

  document.getElementById("message").innerHTML =

    '<div class="' +
    (isError ? 'error' : '') +
    '">' +
    escapeHTML(message) +
    '</div>';

}

// ===================================
// UNLOCK
// ===================================

function unlockScanner() {

  busy = false;

  document.getElementById("againBtn").classList.remove("hidden");

}

</script>

</body>
</html>
