<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eternal Bloom Check-in</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f8f3f5;
  text-align: center;
  padding: 20px;
  color: #55434b;
}

.container {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px #00000010;
}

h1 {
  color: #a76d87;
  font-size: 27px;
}

input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  font-size: 16px;
}

input {
  border: 1px solid #ddc8d2;
}

button {
  border: none;
  background: #b77f99;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#reader {
  width: 100%;
  margin: 15px auto;
}

#result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  display: none;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.success {
  display: block !important;
  background: #e5f5e9;
  color: #267442;
}

.error {
  display: block !important;
  background: #fce8e8;
  color: #a33333;
}

.small {
  font-size: 12px;
  color: #99838e;
}
</style>
</head>

<body>

<div class="container">

<h1>🌷 Eternal Bloom</h1>
<p>STAFF CHECK-IN SYSTEM</p>

<input
  type="password"
  id="pin"
  placeholder="Enter Staff PIN"
>

<button id="startBtn" onclick="startScanner()">
  OPEN CAMERA
</button>

<div id="reader"></div>

<div id="result"></div>

<button id="againBtn" onclick="scanAgain()" style="display:none">
  SCAN NEXT GUEST
</button>

<p class="small">Eternal Bloom · Guest Registration</p>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbzXxXA_WQotROJJ9RMfnH-WbLeqeyYNb8OGSRa9GixunqVXv6khAtQK7ofl2ty8hgSkPA/exec";

let scanner = null;
let scanning = false;
let busy = false;

function showResult(data) {

  const box = document.getElementById("result");

  if (data.success) {

    box.className = "success";

    box.innerHTML = `
      <h2>✓ CHECK-IN SUCCESSFUL</h2>
      <b>Name:</b> ${escapeHTML(data.name)}<br>
      <b>Round:</b> ${escapeHTML(data.round)}<br>
      <b>Menu:</b> ${escapeHTML(data.menu)}<br>
      <b>ID:</b> ${escapeHTML(data.id)}<br>
      <b>Time:</b> ${escapeHTML(data.time)}
    `;

  } else {

    box.className = "error";

    box.innerHTML = `
      <h3>⚠ ${escapeHTML(data.message || "CHECK-IN FAILED")}</h3>
    `;

  }

  document.getElementById("againBtn").style.display = "block";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function checkInGuest(registrationId, pin) {

  const callbackName =
    "ebCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

  return new Promise((resolve, reject) => {

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Connection timeout"));
    }, 20000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Cannot connect to Google Apps Script"));
    };

    const params = new URLSearchParams({
      action: "checkin",
      registrationId: registrationId,
      pin: pin,
      callback: callbackName
    });

    script.src = GAS_URL + "?" + params.toString();

    document.body.appendChild(script);

  });

}

async function startScanner() {

  const pin = document.getElementById("pin").value.trim();

  if (!pin) {
    alert("Please enter Staff PIN");
    return;
  }

  document.getElementById("startBtn").disabled = true;

  try {

    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("No camera found");
    }

    const backCamera = cameras.find(camera =>
      /back|rear|environment/i.test(camera.label)
    );

    const cameraId = backCamera
      ? backCamera.id
      : cameras[cameras.length - 1].id;

    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },

      async (decodedText) => {

        if (!scanning || busy) return;

        scanning = false;
        busy = true;

        try {

          await scanner.pause(true);

          const result = await checkInGuest(
            decodedText.trim(),
            pin
          );

          showResult(result);

        } catch(error) {

          showResult({
            success: false,
            message: error.message
          });

        }

      },

      () => {}

    );

    scanning = true;

    document.getElementById("startBtn").style.display = "none";

  } catch(error) {

    alert("ไม่สามารถเปิดกล้องได้: " + error);

    document.getElementById("startBtn").disabled = false;

  }

}

async function scanAgain() {

  document.getElementById("result").style.display = "none";
  document.getElementById("result").className = "";
  document.getElementById("againBtn").style.display = "none";

  busy = false;
  scanning = true;

  if (scanner) {
    try {
      await scanner.resume();
    } catch(error) {
      scanning = false;
      alert("กรุณารีเฟรชเว็บไซต์แล้วเปิดกล้องใหม่");
    }
  }

}

</script>

</body>
</html>
